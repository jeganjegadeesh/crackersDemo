name: Deploy

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # STEP 1: Deploy the Laravel app files (everything except public/build)
      # This FTP account's home directory IS ALREADY /home/klupjyap/crakersdemo_app,
      # so server-dir must be ./ (not ./crakersdemo_app/, which would nest it inside itself).
      # ---------------------------------------------------------------
      - name: FTP Deploy - App files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_APP_USERNAME }}
          password: ${{ secrets.FTP_APP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/storage/app/public/**
            **/storage/logs/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitattributes
            **/README.md
            **/package.json
            **/package-lock.json
            **/public/build/**

      # ---------------------------------------------------------------
      # STEP 2: Deploy the compiled CSS/JS build assets
      # This FTP account's home directory IS ALREADY /home/klupjyap/public_html/crakersDemo,
      # so server-dir must be ./build/ (not ./crakersDemo/build/, which would nest it inside itself).
      # ---------------------------------------------------------------
      - name: FTP Deploy - Build assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: ./build/