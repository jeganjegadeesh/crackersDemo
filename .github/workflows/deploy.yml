name: Deploy

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # STEP 1: Deploy the Laravel app files (everything except public/build)
      # server-dir is RELATIVE to the FTP account's home directory.
      # If this FTP account's home is already /home/klupjyap/crakersdemo_app,
      # use server-dir: ./
      # If the FTP account's home is /home/klupjyap, use server-dir: ./crakersdemo_app/
      # ---------------------------------------------------------------
      - name: FTP Deploy - App files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./crakersdemo_app/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/storage/app/public/**
            **/storage/logs/**
            **/phpunit.xml
            **/.editorconfig
            **/.gitattributes
            **/README.md
            **/package.json
            **/package-lock.json
            **/public/build/**

      # ---------------------------------------------------------------
      # STEP 2: Deploy the compiled CSS/JS build assets
      # Adjust server-dir the same way as above, but pointing at
      # public_html/crakersDemo/build instead.
      # ---------------------------------------------------------------
      - name: FTP Deploy - Build assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: ./crakersDemo/build/